name: 🐞 Bug report
description: Something on the WiFi Insight page, in its data or on the router doesn't work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more of this form you fill in, the faster it can be fixed:
        most of it is copying and pasting the output of a few commands.

        > [!CAUTION]
        > **Network names and MAC addresses (BSSIDs) can pinpoint your home** on public Wi-Fi maps, and the same goes
        > for your neighbours'. The Site Survey page and its network list show them: crop or blur them in screenshots.
        > The `debug` and `status` commands this form asks for never print them.
        > Never paste router passwords, your WAN IP address or DDNS name.
        >
        > Found a **security problem**? Please don't open an issue: see the [security policy](https://github.com/IfSugar/wifiinsight/security/policy).

        **The check fails, install or update stops, or there's no WiFi Insight tab?** The
        [🧪 Install or setup problem](https://github.com/IfSugar/wifiinsight/issues/new?template=install_problem.yml)
        form walks through the usual causes.

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A clear description of the bug.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Insight → tiles
        - Insight → in-channel interference chart
        - Insight → spectrum heatmap
        - Insight → channel events
        - Site Survey
        - Channel Statistics
        - Troubleshooting
        - Settings
        - Scan now / scheduled neighbour scans
        - Time ranges and averages (10M to 30D)
        - Data collection (empty charts, gaps, numbers that look wrong)
        - Router performance or Wi-Fi hiccups
        - Look and layout
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Wireless → WiFi Insight → Channel Statistics
        2. Pick 5 GHz and 7D
        3. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what happened instead? For a number that looks wrong, what did you expect it to be, and why?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - It happened once
    validations:
      required: true

  - type: dropdown
    id: since
    attributes:
      label: When did it start?
      options:
        - Since I installed WiFi Insight
        - After updating WiFi Insight
        - After a firmware update
        - After changing Wi-Fi settings
        - After a reboot
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Your router
        WiFi Insight's version is at the bottom of its page (… · v1.0.9), or run `wifiinsight.sh version`.
        The firmware version is at the top of every router page.

  - type: input
    id: model
    attributes:
      label: Router model
      placeholder: "RT-AX86U"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: "3004.388.12_2"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WiFi Insight version
      placeholder: "1.0.9"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Operation mode
      description: Administration → Operation Mode.
      options:
        - Wireless router
        - Access point (AP)
        - Repeater or media bridge
        - Something else
    validations:
      required: true

  - type: input
    id: aimesh
    attributes:
      label: AiMesh nodes
      description: Models and how they connect. Leave empty if you have none.
      placeholder: "RP-AX56, wireless backhaul"

  - type: textarea
    id: wifi
    attributes:
      label: Wi-Fi settings
      description: From Wireless → General and Professional. Channel and width, Auto or manual, DFS, Smart Connect, guest networks.
      placeholder: |
        2.4 GHz: channel 1, 20 MHz, manual
        5 GHz: Auto (with DFS), 160 MHz
        Smart Connect: off · guest networks: one on 2.4 GHz

  - type: input
    id: addons
    attributes:
      label: Other addons
      description: amtm, or scMerlin's Sitemap, lists them. This helps spot clashes over page slots, scheduled jobs or service events.
      placeholder: "Diversion, Skynet, scMerlin, connmon, spdMerlin, YazFi"

  - type: input
    id: browser
    attributes:
      label: Browser and computer (problems with the page)
      placeholder: "Chrome 141 on macOS 15.6"

  - type: markdown
    attributes:
      value: |
        ## What the router says
        Run these over SSH. None of them print network names, MAC addresses or IP addresses.

  - type: textarea
    id: debug
    attributes:
      label: Output of `/jffs/addons/wifiinsight/wifiinsight.sh debug`
      description: The router model and firmware, plus the driver's counters and channel settings for each radio. Needed for numbers that look wrong, a missing band or scan problems.
      render: shell

  - type: textarea
    id: status
    attributes:
      label: Output of `/jffs/addons/wifiinsight/wifiinsight.sh status`
      description: The scheduled jobs, how many samples there are and how old the newest is, and recent channel events. Needed for empty charts and gaps.
      render: shell

  - type: textarea
    id: syslog
    attributes:
      label: WiFi Insight's lines in the system log
      description: |
        `grep -i wifiinsight /tmp/syslog.log | tail -n 40`. If you use Scribe or syslog-ng, the log is in `/opt/var/log/messages` instead.
      render: shell

  - type: textarea
    id: browser-console
    attributes:
      label: Browser console errors (problems with the page)
      description: Open the browser's developer tools (F12, or ⌥⌘I on macOS) → Console, reload the page and copy the red errors.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here. On Site Survey, crop or blur network names and MAC addresses.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Did it work in an earlier version? Does the router's own UI (Wireless Log, Network Map) agree with what WiFi Insight shows? Anything unusual about your setup?

  - type: markdown
    attributes:
      value: |
        ### Want to fix it yourself?
        Great! After submitting, comment with how you would fix it and wait for a maintainer to agree and assign the
        issue to you before opening a pull request. The script must only use the BusyBox commands Merlin includes
        ([`.github/tests/merlin-applets.txt`](https://github.com/IfSugar/wifiinsight/blob/main/.github/tests/merlin-applets.txt)),
        and [`.github/tests/large-history.sh`](https://github.com/IfSugar/wifiinsight/blob/main/.github/tests/large-history.sh) must pass.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I've searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I'm on the latest version (ran `wifiinsight.sh update`, then reloaded the page with Ctrl+F5 / Cmd+Shift+R).
          required: true
        - label: I removed passwords, my WAN IP and DDNS name, and cropped or blurred network names and MAC addresses in screenshots.
          required: true
