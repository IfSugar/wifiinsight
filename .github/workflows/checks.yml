# Checks the addon on every pull request and every push. It never publishes anything:
# releases only happen when a version tag is pushed (see release.yml).
name: Checks

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Script and page versions match
        run: |
          sh_ver=$(sed -n 's/^VERSION="\([0-9][0-9.]*\)".*/\1/p' wifiinsight.sh | head -1)
          asp_ver=$(sed -n 's/.*wifiinsight-version: \([0-9][0-9.]*\) .*/\1/p' wifiinsight.asp | head -1)
          echo "wifiinsight.sh: $sh_ver   wifiinsight.asp: $asp_ver"
          if [ -z "$sh_ver" ]; then echo "::error file=wifiinsight.sh::No VERSION=\"x.y.z\" line"; exit 1; fi
          if [ "$sh_ver" != "$asp_ver" ]; then
            echo "::error file=wifiinsight.asp::Page is version '$asp_ver' but the script is '$sh_ver'. The installer needs them to match."
            exit 1
          fi

      - name: Check the script runs on a router shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox sqlite3 > /dev/null
          busybox ash -n wifiinsight.sh   # the router's shell
          sh -n wifiinsight.sh            # dash, a strict POSIX shell
          if grep -n 'command -v' wifiinsight.sh; then
            echo "::error file=wifiinsight.sh::Router BusyBox builds can lack 'command'; use have() instead."
            exit 1
          fi

      - name: Run every suite, in parallel
        # Each suite in .github/tests is independent (its own temporary folder, stand-ins and clock), so they
        # run at once; the output comes grouped per suite, then a summary. What they check:
        #   large-history   the data files stay complete with a long history (Merlin's BusyBox only, and [,
        #                   printf and echo as separate programs: 128 KB per argument, like the router)
        #   radar           radar lines become events with the right time and radio, in one quick pass
        #   quiet-hours     the page and the script read quiet hours alike; cron jobs for each mode
        #   chanim-formats  both airtime statistics layouts parse (Wi-Fi 6 and Wi-Fi 7 drivers)
        #   scan-wait       scans wait for the driver (slow 5 GHz scans on 3006.102)
        #   measured        the radio's per-channel measurements are stored and exported
        #   short-scans     scans the driver stops early are finished; old per-channel figures aren't stored
        #   one-channel     a refused full scan falls back to one channel at a time
        #   trickle         one-channel scans are spread out, only where full scans are refused
        #   repair          a damaged database is noticed, reported and repaired
        #   storage         no Entware: the firmware's sqlite3, a folder on the drive, the move from /opt
        #   tamper          a database or files someone put in the history folder can't be turned against the router
        #   old-copy        an old copy of the script hands over to the installed one
        #   radio-bands     bands, widths and centres read right (2.4, 5 and 6 GHz, 320 MHz)
        #   multi-radio     two radios on one band, and four radios, are kept apart
        #   amtm            amtm support (amtmupdate, the menu, amtm's version check)
        #   dev-update      update dev [branch]; plain update stays on releases
        run: bash .github/run-tests.sh

      - name: Check the page's JavaScript
        run: |
          python3 - <<'EOF'
          import re
          page = open('wifiinsight.asp', encoding='utf-8').read()
          js = '\n'.join(re.findall(r'<script type="text/javascript">(.*?)</script>', page, re.S))
          js = re.sub(r'<%.*?%>', '{}', js)   # router template tags
          open('/tmp/page.js', 'w', encoding='utf-8').write(js)
          EOF
          node --check /tmp/page.js
          # The page code must stay inside its private (function () { ... })(); scope:
          # a global $ or store() replaces the firmware's and breaks the router's menu.
          if ! grep -q '^(function () {$' wifiinsight.asp || ! grep -q '^})();$' wifiinsight.asp; then
            echo "::error file=wifiinsight.asp::Page code must stay wrapped in (function () { ... })(); so it can't clash with the firmware's globals."
            exit 1
          fi

      - name: Changelog entry
        run: |
          v=$(sed -n 's/^VERSION="\([0-9][0-9.]*\)".*/\1/p' wifiinsight.sh | head -1)
          if ! grep -q "^## $v\( \|$\)" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::No '## $v' section; its release notes would list commit titles instead."
          fi

  firmware-sqlite:
    # WiFi Insight uses the firmware's own sqlite3 (/usr/sbin/sqlite3), not Entware's: every suite runs
    # with the two versions Merlin ships, built from its source (and kept in the cache after the first build).
    # 3.25.3: 386.1 to 3004.388.4; 3.42.0 since.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlite: ['3.25.3', '3.42.0']
    steps:
      - uses: actions/checkout@v5

      - name: Install busybox and sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox sqlite3 > /dev/null

      - name: Restore the firmware's sqlite3 ${{ matrix.sqlite }}
        id: fwsqlite
        uses: actions/cache@v4
        with:
          path: ~/fwsqlite
          key: fwsqlite-${{ matrix.sqlite }}-${{ hashFiles('.github/firmware-sqlite.sh') }}

      - name: Build it from the Merlin source
        if: steps.fwsqlite.outputs.cache-hit != 'true'
        run: sh .github/firmware-sqlite.sh ${{ matrix.sqlite }} "$HOME/fwsqlite" && rm -rf "$HOME/fwsqlite/src"

      - name: Run every suite with it, in parallel
        run: |
          export PATH="$HOME/fwsqlite:$PATH" FW_SQLITE_BIN="$HOME/fwsqlite/sqlite3"
          sqlite3 -version
          bash .github/run-tests.sh
