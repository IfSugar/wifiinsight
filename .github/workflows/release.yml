# Publishes a release only when a version tag (e.g. 1.0.11) is pushed, or created with
# GitHub's "Draft a new release" page. Merging to main never releases.
#
# The tag must match VERSION in wifiinsight.sh and the page's "wifiinsight-version:" line,
# and point at a commit on main. The checks run again first. The notes are the version's
# CHANGELOG.md section (see .github/release-notes.sh), plus install instructions.
#
# Separately, when CHANGELOG.md changes on main, every existing release's notes are
# refreshed to match it (this never creates a tag or a release).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths:   # only filters the branch pushes; tag pushes always run
      - CHANGELOG.md
      - .github/release-notes.sh

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/checks.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the other tags and main

      - name: The tag matches the version and is on main
        run: |
          sh_ver=$(sed -n 's/^VERSION="\([0-9][0-9.]*\)".*/\1/p' wifiinsight.sh | head -1)
          asp_ver=$(sed -n 's/.*wifiinsight-version: \([0-9][0-9.]*\) .*/\1/p' wifiinsight.asp | head -1)
          if [ "$TAG" != "$sh_ver" ] || [ "$TAG" != "$asp_ver" ]; then
            echo "::error::Tag $TAG doesn't match the files (wifiinsight.sh: $sh_ver, wifiinsight.asp: $asp_ver). Bump VERSION in both, merge, then tag again."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that isn't on main. Merge the pull request first, then tag main."
            exit 1
          fi

      - name: Publish the release
        run: |
          prev=$(git tag --list --sort=-v:refname | awk -v v="$TAG" 'f { print; exit } $0 == v { f = 1 }')
          sh .github/release-notes.sh "$TAG" "$prev" > /tmp/notes.md
          cat /tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Created on GitHub's release page: fill in the notes and attach the files.
            gh release upload "$TAG" wifiinsight.sh wifiinsight.asp --clobber
            gh release edit "$TAG" --title "WiFi Insight $TAG" --notes-file /tmp/notes.md
            echo "Completed release $TAG"
          else
            gh release create "$TAG" wifiinsight.sh wifiinsight.asp --verify-tag \
              --title "WiFi Insight $TAG" --notes-file /tmp/notes.md
            echo "Released $TAG"
          fi

  sync-notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync every release's notes with CHANGELOG.md
        run: |
          tags=$(git tag --list --sort=-v:refname)
          for t in $tags; do
            grep -q "^## $t\( \|$\)" CHANGELOG.md || continue
            gh release view "$t" > /dev/null 2>&1 || continue
            prev=$(printf '%s\n' "$tags" | awk -v v="$t" 'f { print; exit } $0 == v { f = 1 }')
            sh .github/release-notes.sh "$t" "$prev" > "/tmp/notes-$t.md"
            if [ "$(gh release view "$t" --json body --jq .body)" != "$(cat "/tmp/notes-$t.md")" ]; then
              gh release edit "$t" --notes-file "/tmp/notes-$t.md"
              echo "Updated the notes of $t"
            fi
          done
